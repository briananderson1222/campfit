name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check content boundary
        run: npm run check:content-boundary

      - name: Check decision registry
        run: npm run check:decisions

      - name: TypeScript compile check
        run: pnpm exec tsc --noEmit

      - name: Traverse replay proof (schema-directed extraction pilot)
        run: npm run test:traverse-replay

      - name: Traverse sources-strategy crawl frontier proof (campfit#133)
        run: npm run test:traverse-crawl

      # Offline Lookout CHECK/drift proofs (no network, no database).
      - name: Lookout CHECK, drift-gate, event and discovery proofs
        run: |
          npm run test:l4-provider-drift
          npm run test:l4-lookout-check
          npm run test:l4-lookout-events
          npm run test:l4-lookout-discovery

      - name: Survey value-descriptor mapping proof (campfit#45)
        run: npm run verify:survey-value-descriptor

  render_fetch_proof:
    name: Render-fetch proof (Playwright headless fetch, #41)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Render-fetch proof (local fixture server, no network/DB)
        run: npm run test:render-fetch

  shell_detect_retry_proof:
    name: Shell-detection auto-retry proof (traverse#11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Shell-detection auto-retry proof (local fixture server, no network/DB)
        run: npm run test:shell-detect-retry

  # No secrets: every value below is a placeholder. `next build` only inlines
  # the NEXT_PUBLIC_* values into the bundle; server secrets (service-role key,
  # PG*, CRON_SECRET, Stripe, Resend, model keys) are read at request time, and
  # this build output is never deployed (deploy.yml builds separately).
  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: npm run build

  # Pure contract checks (no DB, no network, no secrets). The browser proof that
  # used to run here moved to `survey_browser_proof`, which is manual-only.
  survey_review_proof:
    name: Survey review proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Survey server session and apply contracts
        run: |
          npm run verify:survey-session
          npm run verify:survey-apply
          npm run verify:survey

  # MANUAL ONLY — TOUCHES THE LIVE DATABASE AND AUTH.
  # Starts a local dev server wired to the repo-level PG* and Supabase secrets
  # (the same database the weekly scraper writes to), signs in as the real
  # admin through hosted Supabase Auth, and records a Survey decision on the
  # first real PENDING proposal (PUT /survey-events), sometimes after editing
  # a field value. Nothing is cleaned up. It cannot run on the throwaway
  # Postgres because login needs hosted Supabase Auth (see docs/local-dev.md,
  # "Tier 2"), so it never runs on pull_request or push.
  survey_browser_proof:
    name: Survey browser proof (manual, live database)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL || secrets.PLAYWRIGHT_PROD_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD || secrets.PLAYWRIGHT_PROD_ADMIN_PASSWORD }}

    steps:
      - name: Check required browser proof env
        run: |
          missing=""
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY PGHOST PGUSER PGPASSWORD PLAYWRIGHT_ADMIN_EMAIL PLAYWRIGHT_ADMIN_PASSWORD; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Survey browser proof requires:$missing" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write browser proof env file
        run: |
          {
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3100}"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'PGHOST=%s\n' "$PGHOST"
            printf 'PGPORT=%s\n' "${PGPORT:-6543}"
            printf 'PGDATABASE=%s\n' "${PGDATABASE:-postgres}"
            printf 'PGUSER=%s\n' "$PGUSER"
            printf 'PGPASSWORD=%s\n' "$PGPASSWORD"
            printf 'PLAYWRIGHT_ADMIN_EMAIL=%s\n' "$PLAYWRIGHT_ADMIN_EMAIL"
            printf 'PLAYWRIGHT_ADMIN_PASSWORD=%s\n' "$PLAYWRIGHT_ADMIN_PASSWORD"
          } > .env.local

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Survey browser integration
        run: npm run verify:survey-browser

  # Runs against a throwaway Postgres container: schema from the repo's
  # migrations, rows from scripts/sql/ci-verify-admin-fixture.sql. No PG*
  # secrets; DATABASE_URL is loopback with sslmode=disable.
  verify_admin:
    name: Verify admin platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campfit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfit_ci?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to throwaway database
        run: npm run db:migrate

      - name: Load verify fixture rows
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/ci-verify-admin-fixture.sql

      - name: Verify admin platform
        run: npm run verify:admin

  review_apply_unit_tests:
    name: Review Apply module tests (vitest, throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campfit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campfit_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision test database schema
        run: npm run test:db:reset

      - name: Run vitest integration suite
        run: npm run test
