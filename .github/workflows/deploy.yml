name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy production to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

    steps:
      - name: Check deploy env
        id: preflight
        run: |
          missing=""
          for key in VERCEL_TOKEN VERCEL_PROJECT_ID VERCEL_ORG_ID; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy. Missing:$missing"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v6

      # Reads the exact pnpm version from package.json's packageManager field,
      # so it needs the same preflight guard the checkout above carries. It also
      # puts pnpm on PATH for `vercel build`, which picks its package manager
      # from the lockfile in the checkout.
      - name: Setup pnpm
        if: steps.preflight.outputs.enabled == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.preflight.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: steps.preflight.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.preflight.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.preflight.outputs.enabled == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: steps.preflight.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --archive=tgz --prod --token="$VERCEL_TOKEN"
